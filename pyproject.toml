[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qedcalc"
version = "0.90.0"
description = "Small-step symbolic QED calculation toolkit"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13"
]

[tool.setuptools.packages.find]
include = ["qedcalc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
